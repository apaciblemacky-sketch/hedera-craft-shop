{% extends 'base.html' %}
{% block content %}
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; max-width: 550px; margin: 1rem auto;">
    <h2 style="color: #1a202c; margin-bottom: 0.5rem;">Upload New Craft</h2>
    
    <form method="POST" enctype="multipart/form-data">
      <label style="display:block; margin-top: 1rem; font-weight: 600;">Category</label>
      <select name="category_name" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px;">
        {% for cat in categories %}
          <option value="{{ cat.name }}">{{ cat.name }}</option>
        {% endfor %}
      </select>

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Craft Title</label>
      <input type="text" name="name" required placeholder="e.g. Woven Basket" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Description</label>
      <textarea name="description" required rows="3" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;"></textarea>

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Price (₱ PHP)</label>
      <input type="number" step="0.01" name="price" required placeholder="350.00" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Item Picture</label>
      <input type="file" name="image" accept="image/*" style="display: block; margin-top: 0.4rem; padding: 0.4rem; border: 1px dashed #cbd5e0; width: 100%; border-radius: 6px; box-sizing: border-box;">

      <button class="btn" type="submit" style="margin-top: 1.5rem;">Publish Item</button>
    </form>
  </div>
{% endblock %}
