<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macleen's Crafts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #fcf9fb; color: #2c3e50; line-height: 1.6; }
    
    header { background: #ffffff; border-bottom: 2px solid #f472b6; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 4px rgba(225, 29, 72, 0.05); }
    .navbar { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1.5rem; }
    .brand { font-size: 1.3rem; font-weight: 700; color: #1e3a8a; text-decoration: none; display: flex; align-items: center; gap: 0.6rem; }
    .brand img { height: 44px; width: 44px; object-fit: contain; }
    .nav-links { display: flex; gap: 1rem; align-items: center; }
    .nav-link { color: #4a5568; text-decoration: none; font-weight: 600; padding: 0.5rem 0.8rem; border-radius: 6px; }
    .nav-link:hover { background: #fdf2f8; color: #db2777; }
    .admin-link { color: #888; font-size: 0.85rem; border: 1px dashed #cbd5e0; }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .product-card { background: #ffffff; border: 1px solid #fbcfe8; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04); display: flex; flex-direction: column; }
    .product-image { width: 100%; height: 210px; object-fit: cover; }
    .product-body { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin-bottom: 0.3rem; }
    .product-price { font-size: 1.25rem; font-weight: 700; color: #db2777; margin-bottom: 0.8rem; }
    .product-stats { display: flex; gap: 1rem; color: #718096; font-size: 0.85rem; margin-bottom: 1.2rem; }
    
    .btn { display: inline-block; width: 100%; text-align: center; background: #db2777; color: #ffffff; padding: 0.65rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #be185d; }
    .btn-secondary { background: #1e3a8a; }
    .btn-secondary:hover { background: #172554; }
    .btn-like { background: #fdf2f8; color: #db2777; width: auto; padding: 0.6rem 1.2rem; }
    .btn-edit { background: #1e3a8a; color: #fff; padding: 6px 12px; font-size: 0.85rem; text-decoration: none; border-radius: 4px; }
    .btn-delete { background: #e11d48; color: #fff; padding: 6px 12px; font-size: 0.85rem; border: none; border-radius: 4px; cursor: pointer; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .badge-pending { background: #fef3c7; color: #d97706; }
    .badge-ready { background: #e0e7ff; color: #3730a3; }
    .badge-completed { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="/" class="brand">
        <img src="/static/images/logo.png" alt="Macleen's Crafts Logo" onerror="this.style.display='none'">
        <span>Macleen's Crafts</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Craft Collection</a>
        <a href="/admin" class="nav-link admin-link">🔒 Owner Admin</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
