{% extends 'base.html' %}
{% block content %}
  <p style="margin-bottom: 1.5rem;"><a href="/admin" style="color: #2d5a27; font-weight: 600; text-decoration: none;">← Back to Owner Admin</a></p>

  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; max-width: 550px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
    <h2 style="color: #1a202c; margin-bottom: 0.5rem;">Edit Craft: {{ item.name }}</h2>
    
    <form method="POST" enctype="multipart/form-data">
      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Item Title</label>
      <input type="text" name="name" value="{{ item.name }}" required style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Description</label>
      <textarea name="description" required rows="3" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">{{ item.description }}</textarea>

      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Price ($)</label>
      <input type="number" step="0.01" name="price" value="{{ item.price }}" required style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Replace Photo (Optional)</label>
      <input type="file" name="image" accept="image/*" style="display: block; margin-top: 0.4rem; padding: 0.4rem; border: 1px dashed #cbd5e0; width: 100%; border-radius: 6px; box-sizing: border-box;">

      <button class="btn" type="submit" style="margin-top: 1.5rem;">Save Changes</button>
    </form>
  </div>
{% endblock %}
