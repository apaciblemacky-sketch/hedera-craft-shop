<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macleen's Crafts by Macleen's Food House</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #fff5f7; color: #2d3748; line-height: 1.6; }
    
    header { background: #ffffff; border-bottom: 2px solid #f472b6; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(244, 114, 182, 0.1); }
    .navbar { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.5rem; }
    .brand-container { display: flex; flex-direction: column; text-decoration: none; }
    .brand-title { font-size: 1.35rem; font-weight: 800; color: #db2777; line-height: 1.1; }
    .brand-sub { font-size: 0.78rem; font-weight: 700; color: #be185d; letter-spacing: 0.5px; text-transform: uppercase; }
    
    .nav-links { display: flex; gap: 1rem; align-items: center; }
    .nav-link { color: #4a5568; text-decoration: none; font-weight: 600; padding: 0.5rem 0.8rem; border-radius: 6px; }
    .nav-link:hover { background: #fdf2f8; color: #db2777; }
    .admin-link { color: #9ca3af; font-size: 0.85rem; border: 1px dashed #fbcfe8; }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .product-card { background: #ffffff; border: 1px solid #fbcfe8; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 10px rgba(219, 39, 119, 0.05); display: flex; flex-direction: column; }
    .product-image { width: 100%; height: 210px; object-fit: cover; }
    .product-body { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin-bottom: 0.3rem; }
    .product-price { font-size: 1.25rem; font-weight: 800; color: #db2777; margin-bottom: 0.8rem; }
    .product-stats { display: flex; gap: 1rem; color: #718096; font-size: 0.85rem; margin-bottom: 1.2rem; }
    
    .btn { display: inline-block; width: 100%; text-align: center; background: #ec4899; color: #ffffff; padding: 0.65rem 1.2rem; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #db2777; }
    .btn-outline { background: transparent; border: 1px solid #ec4899; color: #ec4899; }
    .btn-outline:hover { background: #fdf2f8; }
    .btn-delete { background: #f43f5e; color: #fff; padding: 6px 12px; font-size: 0.85rem; border: none; border-radius: 6px; cursor: pointer; }
    .btn-edit { background: #8b5cf6; color: #fff; padding: 6px 12px; font-size: 0.85rem; text-decoration: none; border-radius: 6px; }
    
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; display: inline-block; }
    .badge-pending { background: #fef3c7; color: #d97706; }
    .badge-ready { background: #e0e7ff; color: #4338ca; }
    .badge-completed { background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="/" class="brand-container">
        <span class="brand-title">🎀 Macleen's Crafts</span>
        <span class="brand-sub">by Macleen's Food House</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Craft Catalog</a>
        <a href="/admin" class="nav-link admin-link">🔒 Owner Admin</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
