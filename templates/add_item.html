{% extends 'base.html' %}
{% block content %}
  <div style="background: #ffffff; border: 1px solid #fbcfe8; border-radius: 12px; padding: 2rem; max-width: 550px; margin: 1rem auto;">
    <h2 style="color: #831843; margin-bottom: 0.5rem;">Upload New Craft</h2>
    
    <form method="POST" enctype="multipart/form-data">
      <label style="display:block; margin-top: 1rem; font-weight: 600;">Category</label>
      <select name="category_name" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #fbcfe8; border-radius: 6px;">
        {% for cat in categories %}
          <option value="{{ cat.name }}">{{ cat.name }}</option>
        {% endfor %}
      </select>

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Availability Type</label>
      <select name="availability_type" id="availType" onchange="toggleStockField()" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #fbcfe8; border-radius: 6px;">
        <option value="In Stock">In Stock (Track Inventory)</option>
        <option value="Pre-Order">Pre-Order (Made to Order)</option>
      </select>

      <div id="stockFieldDiv" style="display: block; margin-top: 1rem;">
        <label style="display:block; font-weight: 600;">Available Stock Quantity</label>
        <input type="number" name="stock_quantity" value="10" min="0" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #fbcfe8; border-radius: 6px; box-sizing: border-box;">
      </div>

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Craft Title</label>
      <input type="text" name="name" required placeholder="e.g. Pink Beaded Bracelet" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #fbcfe8; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Description</label>
      <textarea name="description" required rows="3" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #fbcfe8; border-radius: 6px; box-sizing: border-box;"></textarea>

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Price (₱ PHP)</label>
      <input type="number" step="0.01" name="price" required placeholder="150.00" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #fbcfe8; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600;">Item Picture</label>
      <input type="file" name="image" accept="image/*" style="display: block; margin-top: 0.4rem; padding: 0.4rem; border: 1px dashed #fbcfe8; width: 100%; border-radius: 6px; box-sizing: border-box;">

      <button class="btn" type="submit" style="margin-top: 1.5rem;">Publish Craft</button>
    </form>
  </div>

  <script>
    function toggleStockField() {
      var val = document.getElementById('availType').value;
      document.getElementById('stockFieldDiv').style.display = (val === 'In Stock') ? 'block' : 'none';
    }
  </script>
{% endblock %}
