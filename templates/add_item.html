{% extends 'base.html' %}
{% block content %}
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; max-width: 550px; margin: 1rem auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
    <h2 style="color: #1a202c; margin-bottom: 0.5rem;">Upload New Craft</h2>
    <p style="color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">Add a new handcrafted item to your public Hedera collection.</p>
    
    <form method="POST" enctype="multipart/form-data">
      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Craft Title</label>
      <input type="text" name="name" required placeholder="e.g. Woven Bamboo Basket" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Description</label>
      <textarea name="description" required rows="3" placeholder="Describe the materials, dimensions, and craft technique..." style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;"></textarea>

      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Price ($)</label>
      <input type="number" step="0.01" name="price" required placeholder="0.00" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Product Picture</label>
      <input type="file" name="image" accept="image/*" style="display: block; margin-top: 0.4rem; padding: 0.4rem; border: 1px dashed #cbd5e0; width: 100%; border-radius: 6px; box-sizing: border-box;">

      <button class="btn" type="submit" style="margin-top: 1.5rem;">Publish Item</button>
    </form>
  </div>
{% endblock %}
